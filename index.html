<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070817" />
    <meta name="description" content="三幕浪漫科技烟花、粒子雾效与雪花烟花互动体验" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="浪漫科技烟花秀" />
    <meta property="og:description" content="三幕浪漫科技烟花、粒子雾效与雪花烟花互动体验" />
    <title>浪漫科技烟花秀</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="show" data-scene="1" aria-label="三幕浪漫科技烟花秀，每点击三次进入下一幕">
      <div class="scene-backdrop" aria-hidden="true"></div>
      <div class="aurora" aria-hidden="true"></div>
      <div class="cyber-grid" aria-hidden="true"></div>
      <div class="scan-beam" aria-hidden="true"></div>
      <div class="winter-moon" aria-hidden="true"></div>
      <div class="mountains mountains--far" aria-hidden="true"></div>
      <canvas id="far-layer" aria-hidden="true"></canvas>
      <canvas id="mid-layer" aria-hidden="true"></canvas>
      <div class="horizon" aria-hidden="true"></div>
      <div class="mist mist--back" aria-hidden="true"></div>
      <div class="mountains mountains--near" aria-hidden="true"></div>
      <canvas id="front-layer" aria-hidden="true"></canvas>
      <div class="mist mist--front" aria-hidden="true"></div>
      <div class="frost" aria-hidden="true"></div>
      <div class="prism" aria-hidden="true"></div>
      <div class="transition-flash" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
    </main>
    <script src="./show.js"></script>
  </body>
</html>
